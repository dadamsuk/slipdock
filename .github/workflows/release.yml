# Builds the container image and publishes it to the GitHub Container Registry,
# so that running Slipdock does not require cloning it and waiting for an Elixir
# build.
#
#   ghcr.io/dadamsuk/slipdock:latest       the tip of main (also :main)
#   ghcr.io/dadamsuk/slipdock:1.2.3        a tag v1.2.3 (also :1.2)
#   ghcr.io/dadamsuk/slipdock:sha-abc1234  every build, by commit
#
# After a push to main, a dispatched release of main or a v* tag, the deploy
# job puts that exact image on the production server (see the job for how, and deploy/deploy.sh for the server
# side). If anything on the way there fails, record-failure says where on the
# slipdock board.
#
# The image is amd64 only (#2829: nothing runs it on arm64). The build job
# pushes it by digest and the merge job tags it, so another architecture is
# one more line in the build job's matrix.
#
# Batched releases (#2833, #2837). With the repository variable RELEASE_MODE
# set to `batched` (the slipdock board's release mode), a push to main runs
# no job here: merged cards wait for a release, and a runner's release job
# starts one with `gh workflow run release.yml --ref main`. That dispatch
# tests main's tip once (the gate always tests a dispatch), builds the image
# and deploys it. Unset (on_merge, the default), every push to main releases.
# A v* tag releases either way.
#
# The jobs run where ci.yml's do: on GitHub's runners, or on the self-hosted
# ones while the repository variable CI_RUNNER is set (ci.yml says why).
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One release per ref at a time (#2868). The running one always finishes, so
# a deploy is never cut off; a newer push replaces the one waiting, so merges
# that land in a burst are tested and deployed once, at the newest commit,
# rather than a full suite each on the self-hosted runners. The group can't
# be ci.yml's: that one is ci-<run id>, and cancels. A batched push to main
# (which runs nothing) has a group of its own, so it never takes the waiting
# place of a dispatched release (#2837).
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_MODE == 'batched' && format('release-skipped-{0}', github.run_id) || format('release-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Does the suite need to run again? (#1857) A merged pull request's CI
  # already tested the PR merged into main; if main hadn't moved since, this
  # commit has that tree exactly, and a second run tests nothing new. The
  # script says skip only for a push to main whose PR has a finished CI run
  # on the same tree, every job passed or skipped and the suite's own
  # partitions passed; anything else, its own failure included, runs the
  # suite. Its note goes in the run summary and on the deploy record.
  #
  # When it says skip, the same job keeps main's build cache warm (#1913;
  # its own job until #2832, which folded it in: each job is billed in
  # whole minutes, and the warming only ever ran after the gate). Partition
  # 1 of the suite is what saves the build under main's key, and a pull
  # request restores only from its own ref's caches and main's, so after a
  # skip every new PR would restore an older main build and compile more.
  # This compiles the same build the suite would and saves it under the
  # same key. Its steps may fail without failing the job: a failure here
  # costs a slower PR, never a deploy. The keys, paths and steps are
  # ci.yml's test job's, which ci_workflow_test.exs holds them to.
  suite:
    # Not for a push to main on a batched board (#2837): a dispatch releases.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_MODE == 'batched') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      note: ${{ steps.gate.outputs.note }}
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether the suite runs
        id: gate
        run: .github/scripts/suite-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}

      # The rest warms the cache, only when the gate said skip.
      - uses: erlef/setup-beam@v1
        id: beam
        if: steps.gate.outputs.run == 'false'
        continue-on-error: true
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - name: Cache keys
        id: keys
        if: steps.gate.outputs.run == 'false'
        continue-on-error: true
        run: |
          ws=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)
          base="${{ runner.os }}-mix-$ws-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}"
          deps="$base-${{ hashFiles('**/mix.lock') }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          config="$deps-${{ hashFiles('mix.exs', 'config/**') }}"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "code=$config-${{ hashFiles('lib/**', 'test/support/**', 'priv/**', 'docs/**') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: mix-cache
        if: steps.gate.outputs.run == 'false'
        continue-on-error: true
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}
          restore-keys: |
            ${{ steps.keys.outputs.config }}-
            ${{ steps.keys.outputs.deps }}-
            ${{ steps.keys.outputs.base }}-

      # An exact hit means this tree's build is saved already, and the
      # rest of the job has nothing to do.
      - name: Backdate mix.exs and config to the cached build
        if: steps.gate.outputs.run == 'false' && steps.mix-cache.outputs.cache-hit != 'true' && startsWith(steps.mix-cache.outputs.cache-matched-key, format('{0}-', steps.keys.outputs.config))
        continue-on-error: true
        run: touch -d 2000-01-01 mix.exs config/*.exs

      - if: steps.gate.outputs.run == 'false' && steps.mix-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: mix deps.get

      # The suite's compile, so the manifest it saves carries the same
      # warnings (none, since the PR's CI passed on this tree).
      - name: Compile without warnings
        id: compile
        if: steps.gate.outputs.run == 'false' && steps.mix-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: mix compile --warnings-as-errors

      # Never a build that didn't compile clean.
      - uses: actions/cache/save@v4
        if: steps.gate.outputs.run == 'false' && steps.mix-cache.outputs.cache-hit != 'true' && steps.compile.outcome == 'success'
        continue-on-error: true
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}

  # Nothing is published that the suite has not passed. An image built from a
  # red tree is worse than no image, because somebody will run it.
  #
  # The suite and the image build run side by side rather than one after the
  # other: the build only pushes by digest, which nobody pulls, and nothing
  # gets a tag until the merge job, which needs both. A red suite therefore
  # still publishes nothing, but a green one is not kept waiting for the build.
  #
  # Always called (#2832), with the gate's answer: the suite (and the cli
  # and daemon jobs) skipped only when the gate said so in as many words (a
  # gate that failed or said nothing leaves the suite to run), and the
  # static checks run either way, so every push to main and every release
  # gets them.
  test:
    needs: suite
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_MODE == 'batched') }}
    uses: ./.github/workflows/ci.yml
    with:
      suite: ${{ needs.suite.outputs.run != 'false' }}

  # The slipdock CLI the image serves, signed (#2669, W-2542): on a v* tag
  # the CLI is built here, signed in the next job with the release key (in
  # its own namespace, slipdock-cli), and handed to the image build, which
  # serves those bytes and the signature. The runner daemon installs a
  # server's CLI only with a signature that verifies, so a commit the
  # release job didn't sign (a push to main) serves its CLI unsigned, and
  # the machines keep theirs unless their local.json sets cli_checksum_only.
  #
  # The skills archive (/api/skills.tar.gz, #2784) goes the same way: packed
  # here from priv/skills, signed in its own namespace (slipdock-skills),
  # served as those bytes; the daemon installs it only signed, unless
  # local.json sets skills_unsigned.
  #
  # Built with no secrets at all; signed in the next job, which is the only
  # one that can read the key.
  cli-build:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - name: Build the CLI
        working-directory: cli
        run: |
          mix escript.build
          mkdir -p ../cli-dist
          mv slipdock ../cli-dist/slipdock.escript

      # The same layout as Slipdock.Skills.tarball/0 (a folder for each
      # slipdock* skill), packed so that the same tree gives the same bytes.
      - name: Pack the skills
        run: |
          cd priv/skills
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 --mode=u=rwX,go=rX \
            -cf - slipdock* | gzip -n > ../../cli-dist/slipdock-skills.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: cli-unsigned
          path: |
            cli-dist/slipdock.escript
            cli-dist/slipdock-skills.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Signs the CLI as daemon-release signs release.json: the same secret, in
  # the same environment (v* tags only, a reviewer's approval), so neither a
  # stray run nor a pull request can sign. The signature is checked against
  # the committed public key before the image is built with it.
  cli-sign:
    needs: cli-build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: daemon-release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: daemon/internal/release

      - uses: actions/download-artifact@v4
        with:
          name: cli-unsigned
          path: dist

      - name: Sign the CLI
        run: |
          umask 077
          key_file="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DAEMON_SIGNING_KEY" > "$key_file"
          ssh-keygen -Y sign -q -f "$key_file" -n slipdock-cli dist/slipdock.escript
          ssh-keygen -Y sign -q -f "$key_file" -n slipdock-skills dist/slipdock-skills.tar.gz
        env:
          DAEMON_SIGNING_KEY: ${{ secrets.DAEMON_SIGNING_KEY }}

      - name: Check the signature against the committed key
        run: |
          key=$(awk '!/^#/ && NF { print $1 " " $2; exit }' daemon/internal/release/release_key.pub)
          printf 'slipdock-release namespaces="slipdock-cli,slipdock-skills" %s\n' "$key" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I slipdock-release -n slipdock-cli \
            -s dist/slipdock.escript.sig < dist/slipdock.escript
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I slipdock-release -n slipdock-skills \
            -s dist/slipdock-skills.tar.gz.sig < dist/slipdock-skills.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: cli-signed
          path: |
            dist/slipdock.escript
            dist/slipdock.escript.sig
            dist/slipdock-skills.tar.gz
            dist/slipdock-skills.tar.gz.sig
          if-no-files-found: error
          retention-days: 1

  # On a v* tag the image waits for the signed CLI, and is not built
  # without it; anywhere else there is none to wait for.
  build:
    needs: cli-sign
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_MODE == 'batched') && (needs.cli-sign.result == 'success' || (github.ref_type != 'tag' && needs.cli-sign.result == 'skipped')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64

    steps:
      - uses: actions/checkout@v4

      # Where the Dockerfile looks for it: those bytes are then the ones
      # served, beside their signature.
      - uses: actions/download-artifact@v4
        if: ${{ needs.cli-sign.result == 'success' }}
        with:
          name: cli-signed
          path: priv/cli/signed

      - name: Work out a filename-safe name for this platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      # BuildKit from mirror.gcr.io rather than Docker Hub, which times out
      # from runners often enough to fail the build before it starts.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # BuildKit's own settings, from the repository variable
          # BUILDKITD_CONFIG (TOML), unset on GitHub's runners. On the
          # self-hosted ones (#2829) it names the nameservers: the machine
          # answers plain DNS only from its provider's resolvers, and the
          # build's containers otherwise inherit ones that time out, so
          # every fetch in the build failed with nxdomain.
          buildkitd-config-inline: ${{ vars.BUILDKITD_CONFIG }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image has no .git, so Slipdock.Build is told the commit here;
          # without it Configuration and exports report it as "unknown".
          build-args: |
            SLIPDOCK_GIT_SHA=${{ github.sha }}
          # No tag here: tagging happens once, in the merge job, or each
          # architecture would overwrite the other's tag as it finished.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest for the merge job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          # The `sha256:` prefix has to come off: upload-artifact refuses any
          # filename containing a colon, and the digest is the filename.
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The suite passed here, or the gate skipped it because it had passed on the
  # pull request at this tree; either way ci.yml ran, the static checks
  # passed, and test succeeded. A test that didn't (a failed or cancelled
  # run) is not a pass.
  #
  # Its own job, not folded into the gate or the build (#2832): it needs
  # both the suite and the image, which run side by side, and folding it
  # into either would make the other wait.
  merge:
    needs: [suite, test, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      deploy-tag: ${{ steps.pin.outputs.tag }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # BuildKit from mirror.gcr.io rather than Docker Hub, which times out
      # from runners often enough to fail the build before it starts.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Stitch the architectures into one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          # One empty file per architecture, named after its digest with the
          # `sha256:` prefix stripped off (see the build job).
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)

      - name: Say what was published
        run: |
          docker buildx imagetools inspect \
            "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}"

      # The one tag the deploy job pins to: the release version for a v* tag,
      # otherwise this commit's sha- tag. Never `latest`, which moves, so a
      # deploy can be repeated and a rollback is a deploy of the previous one.
      - name: Pick the tag to deploy
        id: pin
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$VERSION"
          else
            tag=$(jq -r '.tags[] | select(test(":sha-[0-9a-f]+$")) | sub(".*:"; "")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy tag: $tag"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  # The runner daemon's signed release (W-2542, #2578), from a v* tag: the
  # binaries for every platform, release.json (each one's SHA-256 and size)
  # and the two installers, published as the tag's GitHub Release. The daemon
  # and the installers install nothing whose signature doesn't verify
  # against daemon/internal/release/release_key.pub, the one copy of the
  # public key: the binary embeds it, and this job writes it into the
  # installers.
  #
  # Built here with no secrets at all; signed in the next job, which is the
  # only one that can read the key.
  daemon-build:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Without -race, on purpose (#2960). The race detector is ci.yml's
      # daemon job's (#2664): it runs on this tag's tree in the test job
      # above unless the gate found the pull request's CI already passed on
      # it, and that pull request's CI ran it whenever daemon/** changed;
      # the nightly runs it on every OS. Here it would add 3 to 4 minutes to
      # every release and find nothing those runs don't. This is a quick
      # check that the tree the binaries are built from passes, in the job
      # that builds them.
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      # Pure Go, so every platform cross-compiles from here. The platform
      # list is the release package's (release-manifest -platforms), the
      # same one release.json is written from.
      - name: Build every platform
        run: |
          mkdir -p dist
          go run ./cmd/release-manifest -version "$VERSION" -platforms |
            while read -r platform name; do
              CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -trimpath \
                -ldflags "-s -w -X github.com/dadamsuk/slipdock/daemon/internal/cli.Version=$VERSION" \
                -o "dist/$name" ./cmd/slipdock-runner
            done
          go run ./cmd/release-manifest -version "$VERSION" -dir dist
          cat dist/release.json
        env:
          VERSION: ${{ github.ref_name }}

      # A release with no key in it would install nothing, so it isn't made.
      - name: Write the release key into the installers
        run: |
          key=$(awk '!/^#/ && NF { print $1 " " $2; exit }' internal/release/release_key.pub)
          case $key in
            "ssh-ed25519 "?*) ;;
            *) echo "::error::daemon/internal/release/release_key.pub holds no ssh-ed25519 key"; exit 1 ;;
          esac
          sed "s|__SLIPDOCK_RELEASE_KEY__|$key|" install.sh > dist/install.sh
          sed "s|__SLIPDOCK_RELEASE_KEY__|$key|" install.ps1 > dist/install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-dist
          path: daemon/dist/*
          if-no-files-found: error
          retention-days: 1

  # Signs release.json and publishes the release. The private key is the
  # secret DAEMON_SIGNING_KEY, which only the daemon-release environment
  # holds: that environment allows v* tags only and waits for a reviewer's
  # approval, so neither a stray run nor a pull request can sign. The
  # signature is checked against the committed public key before anything
  # is published, so a secret that isn't its other half fails here.
  #
  # It also needs the test job (#2989), as the image's merge job does: the
  # build runs beside the suite, but nothing is signed or published until
  # the tag's suite has passed, ci.yml's daemon job (go test -race) with it.
  # On a v* tag the gate always runs the suite. With no if: of its own the
  # job runs only when both have succeeded, so a red or cancelled suite
  # publishes nothing, and the environment's approval is asked for only
  # once the suite is green.
  daemon-release:
    needs: [daemon-build, test]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: daemon-release
    permissions:
      contents: write
    concurrency:
      group: daemon-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: daemon/internal/release

      - uses: actions/download-artifact@v4
        with:
          name: daemon-dist
          path: dist

      - name: Sign release.json
        run: |
          umask 077
          key_file="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DAEMON_SIGNING_KEY" > "$key_file"
          ssh-keygen -Y sign -q -f "$key_file" -n slipdock-runner dist/release.json
        env:
          DAEMON_SIGNING_KEY: ${{ secrets.DAEMON_SIGNING_KEY }}

      - name: Check the signature against the committed key
        run: |
          key=$(awk '!/^#/ && NF { print $1 " " $2; exit }' daemon/internal/release/release_key.pub)
          printf 'slipdock-release namespaces="slipdock-runner" %s\n' "$key" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I slipdock-release -n slipdock-runner \
            -s dist/release.json.sig < dist/release.json

      # A pre-release tag (v1.2.0-rc.1) is published as one, so the latest
      # release, which the daemon and the installers read, stays the last
      # full one.
      - name: Publish the release
        run: |
          pre=""
          case $TAG in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "slipdock-runner $TAG" \
            --notes "The runner daemon, signed. Install: see the manual's Machines page. release.json.sig is an OpenSSH signature (namespace slipdock-runner) of release.json with the key in daemon/internal/release/release_key.pub."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  # A release that failed on its way to production (#2820): a build, the
  # suite, the merge, the deploy or the health check. Above the deploy job
  # in the file only because that one stays last (release_workflow_test);
  # it runs after it. The deploy job only
  # records what it ran, so a failure before it would leave nothing on the
  # board. This records a failed deploy for the commit with the stage and
  # this run's link, the cards its commits name showing "Deploy failed at
  # <stage>" until a deploy naming them succeeds; when the deploy job had
  # recorded the attempt, that record is the one marked. Like every record
  # step it may fail without failing anything else.
  #
  # .github/scripts/failed-stage.sh works the stage out from the results
  # and prints nothing when nothing on the path failed (only a job off it,
  # such as the daemon release).
  #
  # A job cancelled under the run counts as failed (#3009): a runner GitHub
  # never acquired (its macOS, at capacity) cancels the job, and failure()
  # is false then, so the release went unrecorded and the board showed it
  # running until its timeout. A run a person cancels (cancelled()) records
  # nothing.
  record-failure:
    needs: [suite, test, cli-build, cli-sign, build, merge, deploy]
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # For the record's secret and variable, as the deploy job has them.
    environment: production
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        continue-on-error: true
        with:
          otp-version: "27"

      - name: Install the slipdock CLI
        continue-on-error: true
        run: |
          curl -fsSL "$SLIPDOCK_URL/cli/slipdock.escript" -o "$RUNNER_TEMP/slipdock"
          chmod +x "$RUNNER_TEMP/slipdock"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        env:
          SLIPDOCK_URL: ${{ vars.SLIPDOCK_URL }}

      # A server still coming up after a failed deploy gets a few tries.
      - name: Record the failed deploy
        continue-on-error: true
        run: |
          stage=$(.github/scripts/failed-stage.sh)
          if [ -z "$stage" ]; then
            echo "nothing on the way to production failed: nothing to record"
            exit 0
          fi
          for try in 1 2 3; do
            slipdock deploy failed --env production --stage "$stage" && exit 0
            sleep 10
          done
          exit 1
        env:
          SLIPDOCK_URL: ${{ vars.SLIPDOCK_URL }}
          SLIPDOCK_DEPLOY_TOKEN: ${{ secrets.SLIPDOCK_DEPLOY_TOKEN }}
          SLIPDOCK_DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLI_BUILD: ${{ needs.cli-build.result }}
          CLI_SIGN: ${{ needs.cli-sign.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          MERGE: ${{ needs.merge.result }}
          DEPLOY: ${{ needs.deploy.result }}
          DEPLOY_STAGE: ${{ needs.deploy.outputs.failed-stage }}

  # Puts the image just published on the production server, which is reached
  # only over Tailscale: this runner joins the tailnet as an ephemeral tag:ci
  # node (workload identity federation, so there is no Tailscale secret to
  # leak), runs deploy/deploy.sh over Tailscale SSH (no SSH key either), and
  # then waits for the server to say it is healthy on the new commit.
  #
  # Pushes to main and v* tags, and a dispatched release of main (#2837: how a
  # batched board releases), only — never a pull request, whose code must not
  # get near production credentials — and always through the `production`
  # environment, whose branch and tag rules are a second gate and whose
  # secrets nothing else can read.
  #
  # Needs, on the production environment: secrets TS_OAUTH_CLIENT_ID,
  # TS_AUDIENCE, DEPLOY_HOST (the server's tailnet name) and DEPLOY_HEALTH_URL
  # (https://…/healthz), and the variable DEPLOY_USER. On a self-hosted runner
  # (#2829) the user is the repository variable LOCAL_DEPLOY_USER instead:
  # the tailnet lets the machine's own node in as that user, not as tag:ci's.
  #
  # The merge job only succeeds once the suite has passed (here, or on the
  # pull request at this tree), so its success is the gate; !cancelled() lets
  # a skipped test job through to it.
  deploy:
    needs: [suite, test, merge]
    if: ${{ !cancelled() && needs.merge.result == 'success' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      id-token: write
      contents: read
      # gh run list, for the deploys the record missed (below).
      actions: read
    # One deploy at a time. A newer one waits rather than cancelling one that
    # may be mid-restart; GitHub keeps only the newest waiting, so a burst of
    # merges deploys the first and the last.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    # Where it failed, for the record-failure job (#2820): deploy or health.
    outputs:
      failed-stage: ${{ steps.failed-stage.outputs.stage }}

    steps:
      # Recording the deploy on the slipdock board (#1134): the whole history,
      # so the commits since the last deploy can be read; Erlang for the CLI;
      # and the CLI itself, from the server about to be replaced. Every step of
      # the record is allowed to fail — a deploy matters more than its record.
      # Needs, on the production environment: the secret SLIPDOCK_DEPLOY_TOKEN
      # (`slipdock deploy token slipdock`) and the variable SLIPDOCK_URL. This
      # job is the GitHub Actions worked example's source
      # (priv/deploy/examples/github-actions.yml): keep the two in step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        continue-on-error: true
        with:
          otp-version: "27"

      - name: Install the slipdock CLI
        continue-on-error: true
        run: |
          curl -fsSL "$SLIPDOCK_URL/cli/slipdock.escript" -o "$RUNNER_TEMP/slipdock"
          chmod +x "$RUNNER_TEMP/slipdock"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        env:
          SLIPDOCK_URL: ${{ vars.SLIPDOCK_URL }}

      # Deploys that went out unrecorded (the record is allowed to fail; #1669:
      # it failed for a day after a history rewrite) are filled in from this
      # workflow's successful runs on main since the last recorded deploy,
      # before this one is recorded after them. A sha the board already has
      # is never recorded twice, so this is a no-op when nothing was missed.
      # Batched (#2837), a push to main deployed nothing, so only dispatched
      # releases count: a push's run, whose jobs all skipped, is no deploy.
      - name: Record deploys the record missed
        continue-on-error: true
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main \
            --status success --limit 100 --json headSha,createdAt,updatedAt,conclusion,event |
            jq '[.[] | select(env.RELEASE_MODE != "batched" or .event != "push")]' |
            slipdock deploy backfill --from-runs - --env production
        env:
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
          GH_TOKEN: ${{ github.token }}
          SLIPDOCK_URL: ${{ vars.SLIPDOCK_URL }}
          SLIPDOCK_DEPLOY_TOKEN: ${{ secrets.SLIPDOCK_DEPLOY_TOKEN }}

      # Two steps rather than `slipdock deploy run`: this deploy restarts the
      # server it is recorded on, so it is finished once that server is
      # healthy again, below.
      - name: Record the deploy started
        id: record
        continue-on-error: true
        run: echo "id=$(slipdock deploy start --env production --tag "$TAG")" >> "$GITHUB_OUTPUT"
        env:
          SLIPDOCK_URL: ${{ vars.SLIPDOCK_URL }}
          SLIPDOCK_DEPLOY_TOKEN: ${{ secrets.SLIPDOCK_DEPLOY_TOKEN }}
          TAG: ${{ needs.merge.outputs.deploy-tag }}
          # This run (#2820), so a failure the record-failure job reports
          # marks this record rather than adding a second. An env var: an
          # older CLI ignores it.
          SLIPDOCK_DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # How the suite was satisfied (#1857), kept on the record. An env
          # var, not --note: the CLI comes from the server being replaced,
          # and one older than the switch would refuse it. Quoted: a plain
          # YAML scalar can't hold a colon and a space, and an unparseable
          # workflow fails every push before any job starts (#1916).
          SLIPDOCK_DEPLOY_NOTE: "${{ needs.suite.outputs.note || 'suite: ran' }}"

      # Not on a self-hosted runner (#2829): the machine is on the tailnet
      # already, and the action would install its own tailscale over the
      # machine's and log the machine in as tag:ci. The next step uses the
      # machine's own node, which the tailnet policy has to let in as the
      # deploy user.
      - uses: tailscale/github-action@v4
        if: ${{ !vars.CI_RUNNER }}
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          # Waits for the server to be reachable: a new node takes a moment to
          # be accepted by its peers.
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Reach the server over this machine's tailnet
        if: ${{ vars.CI_RUNNER }}
        run: sudo -n tailscale ping -c 5 "$DEPLOY_HOST"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      # Tailscale SSH: the tailnet authenticates this node as tag:ci and the
      # policy's ssh rule lets it in as the deploy user only, so there is no
      # SSH key to keep, and `tailscale ssh` takes the server's host key from
      # the tailnet rather than trusting whatever answers. sudo because
      # tailscaled runs as root here. The deploy user can run nothing as root
      # but deploy.sh (one sudoers line on the server). The tag goes through
      # the remote shell, so it is checked here first as well as by deploy.sh.
      - name: Deploy
        run: |
          grep -Eqx 'sha-[0-9a-f]{7,40}|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?' <<< "$TAG" ||
            { echo "::error::refusing to deploy unpinned tag '$TAG'"; exit 1; }
          sudo tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /opt/deploy/deploy.sh "$TAG"
        env:
          DEPLOY_USER: ${{ vars.CI_RUNNER && vars.LOCAL_DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.merge.outputs.deploy-tag }}

      # Healthy means answering, reaching Postgres, and built from this commit:
      # a container that never came up (a migration that fails on boot
      # crash-loops it) leaves the old answer or none, and either fails here.
      - name: Wait for the server to be healthy on this commit
        id: health
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            # No -S: a curl error names the host, and the log is public.
            body=$(curl -s --max-time 5 "$HEALTH_URL") || true
            if [ "$(jq -r 'select(.status == "ok") | .sha' <<< "$body" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              echo "healthy on $GITHUB_SHA"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::not healthy on $GITHUB_SHA after 5 minutes; last answer: $body"
              exit 1
            fi
            sleep 5
          done
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}

      # Succeeded or failed, from how the job went; a server still coming up
      # after a failed deploy gets a few tries.
      - name: Record how the deploy ended
        if: always() && steps.record.outputs.id != ''
        continue-on-error: true
        run: |
          for try in 1 2 3; do
            slipdock deploy finish --id "$ID" --status "$STATUS" && exit 0
            sleep 10
          done
          exit 1
        env:
          SLIPDOCK_URL: ${{ vars.SLIPDOCK_URL }}
          SLIPDOCK_DEPLOY_TOKEN: ${{ secrets.SLIPDOCK_DEPLOY_TOKEN }}
          ID: ${{ steps.record.outputs.id }}
          STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}

      # Which part failed, for the record-failure job: the server never
      # coming up healthy, or anything before it.
      - name: Say where the deploy failed
        id: failed-stage
        if: failure()
        run: |
          if [ "$HEALTH" = failure ]; then stage=health; else stage=deploy; fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
        env:
          HEALTH: ${{ steps.health.outcome }}
