# Builds the container image and publishes it to the GitHub Container Registry,
# so that running Slipdock does not require cloning it and waiting for an Elixir
# build.
#
#   ghcr.io/dadamsuk/slipdock:latest       the tip of main (also :main)
#   ghcr.io/dadamsuk/slipdock:1.2.3        a tag v1.2.3 (also :1.2)
#   ghcr.io/dadamsuk/slipdock:sha-abc1234  every build, by commit
#
# After a push to main or a v* tag, the deploy job puts that exact image on the
# production server (see the job for how, and deploy/deploy.sh for the server
# side).
#
# amd64 and arm64 are built on their own native runners rather than one of them
# under QEMU: an Elixir compile emulated is tens of minutes, and GitHub's arm64
# runners are free for public repositories. Each pushes by digest, and a final
# job stitches the two into one multi-architecture tag.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing is published that the suite has not passed. An image built from a
  # red tree is worse than no image, because somebody will run it.
  #
  # The suite and the image build run side by side rather than one after the
  # other: the build only pushes by digest, which nobody pulls, and nothing
  # gets a tag until the merge job, which needs both. A red suite therefore
  # still publishes nothing, but a green one is not kept waiting for the build.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Work out a filename-safe name for this platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      # BuildKit from mirror.gcr.io rather than Docker Hub, which times out
      # from runners often enough to fail the build before it starts.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image has no .git, so Slipdock.Build is told the commit here;
          # without it Configuration and exports report it as "unknown".
          build-args: |
            SLIPDOCK_GIT_SHA=${{ github.sha }}
          # No tag here: tagging happens once, in the merge job, or each
          # architecture would overwrite the other's tag as it finished.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          # The `sha256:` prefix has to come off: upload-artifact refuses any
          # filename containing a colon, and the digest is the filename.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy-tag: ${{ steps.pin.outputs.tag }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # BuildKit from mirror.gcr.io rather than Docker Hub, which times out
      # from runners often enough to fail the build before it starts.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Stitch the architectures into one tag
        working-directory: /tmp/digests
        run: |
          # One empty file per architecture, named after its digest with the
          # `sha256:` prefix stripped off (see the build job).
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)

      - name: Say what was published
        run: |
          docker buildx imagetools inspect \
            "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}"

      # The one tag the deploy job pins to: the release version for a v* tag,
      # otherwise this commit's sha- tag. Never `latest`, which moves, so a
      # deploy can be repeated and a rollback is a deploy of the previous one.
      - name: Pick the tag to deploy
        id: pin
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$VERSION"
          else
            tag=$(jq -r '.tags[] | select(test(":sha-[0-9a-f]+$")) | sub(".*:"; "")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy tag: $tag"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  # Puts the image just published on the production server, which is reached
  # only over Tailscale: this runner joins the tailnet as an ephemeral tag:ci
  # node (workload identity federation, so there is no Tailscale secret to
  # leak), runs deploy/deploy.sh over Tailscale SSH (no SSH key either), and
  # then waits for the server to say it is healthy on the new commit.
  #
  # Pushes to main and v* tags only — never a pull request, whose code must not
  # get near production credentials — and always through the `production`
  # environment, whose branch and tag rules are a second gate and whose
  # secrets nothing else can read.
  #
  # Needs, on the production environment: secrets TS_OAUTH_CLIENT_ID,
  # TS_AUDIENCE, DEPLOY_HOST (the server's tailnet name) and DEPLOY_HEALTH_URL
  # (https://…/healthz), and the variable DEPLOY_USER.
  deploy:
    needs: [test, merge]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    # One deploy at a time. A newer one waits rather than cancelling one that
    # may be mid-restart; GitHub keeps only the newest waiting, so a burst of
    # merges deploys the first and the last.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          # Waits for the server to be reachable: a new node takes a moment to
          # be accepted by its peers.
          ping: ${{ secrets.DEPLOY_HOST }}

      # Tailscale SSH: the tailnet authenticates this node as tag:ci and the
      # policy's ssh rule lets it in as the deploy user only, so there is no
      # SSH key to keep, and `tailscale ssh` takes the server's host key from
      # the tailnet rather than trusting whatever answers. sudo because
      # tailscaled runs as root here. The deploy user can run nothing as root
      # but deploy.sh (one sudoers line on the server). The tag goes through
      # the remote shell, so it is checked here first as well as by deploy.sh.
      - name: Deploy
        run: |
          grep -Eqx 'sha-[0-9a-f]{7,40}|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?' <<< "$TAG" ||
            { echo "::error::refusing to deploy unpinned tag '$TAG'"; exit 1; }
          sudo tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /opt/deploy/deploy.sh "$TAG"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.merge.outputs.deploy-tag }}

      # Healthy means answering, reaching Postgres, and built from this commit:
      # a container that never came up (a migration that fails on boot
      # crash-loops it) leaves the old answer or none, and either fails here.
      - name: Wait for the server to be healthy on this commit
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            # No -S: a curl error names the host, and the log is public.
            body=$(curl -s --max-time 5 "$HEALTH_URL") || true
            if [ "$(jq -r 'select(.status == "ok") | .sha' <<< "$body" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              echo "healthy on $GITHUB_SHA"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::not healthy on $GITHUB_SHA after 5 minutes; last answer: $body"
              exit 1
            fi
            sleep 5
          done
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
