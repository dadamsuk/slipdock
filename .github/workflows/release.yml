# Builds the container image and publishes it to the GitHub Container Registry,
# so that running Slipdock does not require cloning it and waiting for an Elixir
# build.
#
#   ghcr.io/dadamsuk/slipdock:latest    the tip of main
#   ghcr.io/dadamsuk/slipdock:v1.2.3    a tagged release
#   ghcr.io/dadamsuk/slipdock:sha-abc123
#
# amd64 and arm64 are built on their own native runners rather than one of them
# under QEMU: an Elixir compile emulated is tens of minutes, and GitHub's arm64
# runners are free for public repositories. Each pushes by digest, and a final
# job stitches the two into one multi-architecture tag.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing is published that the suite has not passed. An image built from a
  # red tree is worse than no image, because somebody will run it.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Work out a filename-safe name for this platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # No tag here: tagging happens once, in the merge job, or each
          # architecture would overwrite the other's tag as it finished.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          # The `sha256:` prefix has to come off: upload-artifact refuses any
          # filename containing a colon, and the digest is the filename.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Stitch the architectures into one tag
        working-directory: /tmp/digests
        run: |
          # One empty file per architecture, named after its digest with the
          # `sha256:` prefix stripped off (see the build job).
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)

      - name: Say what was published
        run: |
          docker buildx imagetools inspect \
            "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}"
