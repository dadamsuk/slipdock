name: Test

on:
  pull_request:
  workflow_call:

# Everything runs in the test environment, so the warnings check compiles the
# same build `mix test` then reuses instead of a separate dev one.
env:
  MIX_ENV: test

jobs:
  # The suite split four ways, each on its own runner with its own Postgres.
  # `mix test --partitions` deals the test files out by a stable hash, so a
  # file always lands in the same partition; MIX_TEST_PARTITION also suffixes
  # the database name (config/test.exs). The checks that need doing only once
  # (formatting, the browser scripts) ride along with partition 1.
  test:
    name: test (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    # The test suite needs a real Postgres. config/test.exs defaults to
    # localhost:5434, so that is the port this is published on rather than the
    # usual one — the same address `compose.dev.yaml` gives a developer, which
    # means CI and a laptop run the suite against the same URL and neither
    # needs TEST_DATABASE_URL set.
    #
    # Images come through mirror.gcr.io (Google's cache of Docker Hub), not
    # Docker Hub itself: Hub's anonymous pulls from runners time out or are
    # rate-limited often enough to fail whole runs before any code is checked.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          # Version *ranges*, not exact patches: the Dockerfile pins a specific
          # hexpm image, and pinning the same patch here would break the day
          # setup-beam has no build published for it. The majors are what
          # matter — they are what mix.exs and the release agree on.
          elixir-version: "1.20"
          otp-version: "27"

      # deps and the compiled tree, keyed on the lock file and the exact
      # OTP/Elixir pair — a cache built on another version is not reusable.
      # All four partitions restore the same one; whichever finishes first
      # saves it.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - name: Check formatting
        if: matrix.partition == 1
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test --partitions 4
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}

      # The few browser scripts with logic worth testing on their own (the
      # confirm dialog, assets/js/confirm.js) — plain node:test, no packages.
      - uses: actions/setup-node@v4
        if: matrix.partition == 1
        with:
          node-version: "24"

      - name: Test browser scripts
        if: matrix.partition == 1
        run: node --test 'assets/js/**/*.test.js'
