name: Test

# The commit a pull request run tests is the PR merged into main
# (refs/pull/N/merge), which the API doesn't give: a run's head_sha is the
# PR's head. Its name carries it, so release.yml's suite gate can tell whether
# main's merge commit has the tree this run passed on (#1857). Ignored when
# release.yml calls this workflow.
run-name: "${{ github.event.pull_request.title }} · tested ${{ github.sha }}"

on:
  pull_request:
  # release.yml, for a push to main or a v* tag. `suite` is its gate's
  # answer: false when the pull request's CI already passed on this tree,
  # and then only the static checks run (.github/scripts/changes.sh).
  workflow_call:
    inputs:
      suite:
        type: boolean
        default: true
  # The daemon on macOS and Windows, nightly (#2832): a pull request runs it
  # on Linux alone.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Where the jobs run (#2829). With the repository variable CI_RUNNER unset,
# on GitHub's runners. Set (to `slipdock-local`), on the self-hosted runners
# with that label: a private repository pays for GitHub's minutes, a
# self-hosted runner's are free. Unset it before the repository goes public,
# or a pull request from a fork runs its code on that machine (W-1951
# §Self-hosted CI runners). Self-hosted, several jobs share one machine, so a
# job keeps its files under RUNNER_TEMP rather than /tmp and publishes no
# fixed port.

# A newer push to a pull request cancels its older run, queued or running
# (#2829): on the self-hosted runners every superseded run held a runner
# the next PR was waiting for. Called from release.yml, the group is the
# run's own and nothing cancels, so a push to main or a release is never
# cancelled (OPS-2).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything runs in the test environment, so the warnings check compiles the
# same build `mix test` then reuses instead of a separate dev one.
env:
  MIX_ENV: test

jobs:
  # What this run needs to run (#2832): .github/scripts/changes.sh reads the
  # pull request's diff and says which of the suite, the repo checks, the
  # cli and the daemon (and on which OSes) it can break. Every job billed
  # in whole minutes, so the secret scan rides here too: this job has the
  # whole history checked out already, for the diff.
  #
  # Secrets in the commits a pull request adds (gitleaks; allowlists in
  # .gitleaks.toml, each with its reason). Values are redacted in the log,
  # since this repository and its logs are public. A real secret found is
  # rotated, not rewritten out of history. The whole history was scanned
  # once by hand when this was added (#1769). A hit fails this job, and
  # with it every job that needs it: a leaked secret comes first.
  changes:
    name: changes and secret scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      suite: ${{ steps.changes.outputs.suite }}
      repo_checks: ${{ steps.changes.outputs.repo_checks }}
      cli: ${{ steps.changes.outputs.cli }}
      daemon: ${{ steps.changes.outputs.daemon }}
      daemon_os: ${{ steps.changes.outputs.daemon_os }}

    steps:
      # Whole history on a pull request, for the diff and the scan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Decide what runs
        id: changes
        run: .github/scripts/changes.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SUITE: ${{ inputs.suite }}
          CI_RUNNER: ${{ vars.CI_RUNNER }}

      - name: Install gitleaks
        if: github.event_name == 'pull_request'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Secret scan of this pull request's commits (gitleaks)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: $RUNNER_TEMP/gitleaks git --redact --no-banner --verbose --log-opts="$BASE..$HEAD" .

  # The suite split four ways, each on its own runner with its own Postgres.
  # The files are split by how long each took (test/support/test_partitions.ex,
  # weights in test/support/partition_weights.tsv), not by `mix test
  # --partitions`, which deals the sorted list out round robin: the slow files
  # land wherever the alphabet puts them, and one new file moves the rest.
  # MIX_TEST_PARTITION also suffixes the database name (config/test.exs). The
  # checks that need doing only once (formatting, the browser scripts) ride
  # along with partition 1.
  test:
    name: test (${{ matrix.partition }}/4)
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    # The test suite needs a real Postgres, published on a port Docker picks
    # (a fixed one would clash between jobs sharing a self-hosted machine, and
    # with a developer's own database on 5434); the Test step hands it over
    # in TEST_DATABASE_URL.
    #
    # Images come through mirror.gcr.io (Google's cache of Docker Hub), not
    # Docker Hub itself: Hub's anonymous pulls from runners time out or are
    # rate-limited often enough to fail whole runs before any code is checked.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          # Version *ranges*, not exact patches: the Dockerfile pins a specific
          # hexpm image, and pinning the same patch here would break the day
          # setup-beam has no build published for it. The majors are what
          # matter — they are what mix.exs and the release agree on.
          elixir-version: "1.20"
          otp-version: "27"

      # deps and the compiled tree, keyed in layers (#1858): the exact
      # OTP/Elixir pair (a build from another version is no use), the lock
      # file, mix.exs and config, then the code. A run restores the newest
      # build whose key shares the longest prefix with its own, so Mix only
      # recompiles what changed since then, and partition 1 saves the build
      # under this tree's key once it compiles clean. Every layer starts
      # with a hash of the checkout's path (#2901): Mix's compile manifest
      # keeps that path, so a build from a runner that checks out
      # elsewhere (each self-hosted runner has its own work directory) is
      # recompiled whole. With the path in the key a runner restores only
      # builds made where it checks out; GitHub's runners all check out at
      # the same path, so for them it changes nothing.
      - name: Cache keys
        id: keys
        run: |
          ws=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)
          base="${{ runner.os }}-mix-$ws-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}"
          deps="$base-${{ hashFiles('**/mix.lock') }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          config="$deps-${{ hashFiles('mix.exs', 'config/**') }}"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "code=$config-${{ hashFiles('lib/**', 'test/support/**', 'priv/**', 'docs/**') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: mix-cache
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}
          restore-keys: |
            ${{ steps.keys.outputs.config }}-
            ${{ steps.keys.outputs.deps }}-
            ${{ steps.keys.outputs.base }}-

      # The checkout gives every file a fresh mtime. Mix compares sources by
      # digest, but mix.exs and the config files by mtime alone, so a fresh
      # mtime recompiles everything that reads Mix.Project or the config (and
      # what depends on that) though nothing changed. When the restored build
      # was compiled from these same files (its key carries their hash),
      # backdate them; otherwise leave them new so Mix does recompile.
      - name: Backdate mix.exs and config to the cached build
        if: startsWith(steps.mix-cache.outputs.cache-matched-key, format('{0}-', steps.keys.outputs.config))
        run: touch -d 2000-01-01 mix.exs config/*.exs

      - run: mix deps.get

      - name: Check formatting
        if: matrix.partition == 1
        run: mix format --check-formatted

      # An incremental compile still fails on a warning from an earlier one:
      # Mix keeps each file's warnings in its manifest and reports them again.
      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - uses: actions/cache/save@v4
        if: matrix.partition == 1 && steps.mix-cache.outputs.cache-hit != 'true'
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}

      # TEST_TIMINGS_FILE has Slipdock.TestTimings record each file's runtime,
      # uploaded below for refreshing the weights (test/support/test_partitions.exs).
      # --cover with --export-coverage writes this partition's share to
      # cover/partition-N.coverdata rather than checking it: no one partition
      # reaches mix.exs's threshold, so the coverage job checks them merged
      # (#2786).
      - name: Test
        run: |
          files=$(elixir test/support/test_partitions.exs split 4 "$MIX_TEST_PARTITION")
          mix test --cover --export-coverage "partition-$MIX_TEST_PARTITION" $files
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/slipdock_test
          TEST_TIMINGS_FILE: test-timings/test-timings-${{ matrix.partition }}.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.partition }}
          path: test-timings/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.partition }}
          # With the modules :cover couldn't compile, which the coverage job
          # then leaves out rather than finding again (#2848).
          path: |
            cover/partition-${{ matrix.partition }}.coverdata
            cover/partition-${{ matrix.partition }}.skipped
          if-no-files-found: error
          retention-days: 7

      # The few browser scripts with logic worth testing on their own (the
      # confirm dialog, assets/js/confirm.js), and the Cloudflare Email Worker
      # (cloudflare/inbound-email/) — plain node:test, no packages.
      - uses: actions/setup-node@v4
        if: matrix.partition == 1
        with:
          node-version: "24"

      - name: Test browser scripts and the Email Worker
        if: matrix.partition == 1
        run: node --test 'assets/js/**/*.test.js' 'cloudflare/**/*.test.js'

  # The four partitions' coverage merged and held to mix.exs's
  # test_coverage threshold (#2786): mix slipdock.coverage
  # (test/support/coverage.ex) imports each partition's export and fails
  # below it. No Postgres: it runs no tests, only cover-compiles the build
  # the test job cached and reads the exports.
  coverage:
    name: coverage
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - name: Cache keys
        id: keys
        run: |
          ws=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)
          base="${{ runner.os }}-mix-$ws-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}"
          deps="$base-${{ hashFiles('**/mix.lock') }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          config="$deps-${{ hashFiles('mix.exs', 'config/**') }}"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "code=$config-${{ hashFiles('lib/**', 'test/support/**', 'priv/**', 'docs/**') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: mix-cache
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}
          restore-keys: |
            ${{ steps.keys.outputs.config }}-
            ${{ steps.keys.outputs.deps }}-
            ${{ steps.keys.outputs.base }}-

      - name: Backdate mix.exs and config to the cached build
        if: startsWith(steps.mix-cache.outputs.cache-matched-key, format('{0}-', steps.keys.outputs.config))
        run: touch -d 2000-01-01 mix.exs config/*.exs

      - run: mix deps.get

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: cover
          merge-multiple: true

      # An exact hit is the build of this tree, test (1/4)'s. Compiling it
      # again would recompile all of it on a runner other than the one that
      # built it: Mix's manifest keeps the checkout's absolute path, and each
      # self-hosted runner has its own (#2848). So take it as it is; on any
      # other hit the build is older than the tree, and Mix compiles.
      - name: Coverage across the partitions, against the threshold
        run: mix slipdock.coverage ${{ steps.mix-cache.outputs.cache-hit == 'true' && '--no-compile' || '' }}

  # The repo checks (test/repo_checks.txt, #1867) in the suite's place, when
  # a pull request changes only docs, skills, the CLI or the daemon (#2832):
  # they are the tests that read those files, and the compile catches what
  # the app builds from them. `mix pre_push` runs the same list. A Postgres
  # of its own, as a partition has.
  repo-checks:
    name: repo checks
    needs: changes
    if: needs.changes.outputs.repo_checks == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - name: Cache keys
        id: keys
        run: |
          ws=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)
          base="${{ runner.os }}-mix-$ws-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}"
          deps="$base-${{ hashFiles('**/mix.lock') }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          config="$deps-${{ hashFiles('mix.exs', 'config/**') }}"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "code=$config-${{ hashFiles('lib/**', 'test/support/**', 'priv/**', 'docs/**') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: mix-cache
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}
          restore-keys: |
            ${{ steps.keys.outputs.config }}-
            ${{ steps.keys.outputs.deps }}-
            ${{ steps.keys.outputs.base }}-

      - name: Backdate mix.exs and config to the cached build
        if: startsWith(steps.mix-cache.outputs.cache-matched-key, format('{0}-', steps.keys.outputs.config))
        run: touch -d 2000-01-01 mix.exs config/*.exs

      - run: mix deps.get

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # The list's test paths: what Mix.Project's repo_checks/0 reads
      # (ci_workflow_test holds the two to the same list).
      - name: Repo checks
        run: mix test $(grep -Ev '^[[:space:]]*(#|except |$)' test/repo_checks.txt)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/slipdock_test

  # Static checks: the mechanical part of a security review. Each started at
  # zero findings (fixed, or skipped with a reason in its config), so
  # anything new fails the build. None of them needs the database or a
  # compiled app, so they run beside the suite, not in it.
  #
  # Not on a pull request (#2832): `mix pre_push` runs every one of them,
  # in this order, before the push, and the card's evidence carries its
  # result. Here they run on every push to main and every release
  # (release.yml calls this workflow either way, the suite skipped or not),
  # so nothing escapes them, and on a dispatch. Not on the nightly
  # schedule, which runs the daemon alone. Needs nothing, so it starts at
  # once.
  static:
    name: static checks
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      # Whole history, so credo can find where the branch left main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "27"

      # A cache of its own: these checks don't compile the app, so a build
      # saved from here under the test job's key would leave the test job
      # compiling the whole app from cold (#1858).
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-static-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-static-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # Retired packages and Hex's own advisories for the locked versions.
      - name: Retired or vulnerable packages (hex.audit)
        run: mix hex.audit

      # The Elixir security advisory database (mix_audit), which also covers
      # git dependencies Hex knows nothing about.
      - name: Dependency advisories (deps.audit)
        run: mix deps.audit

      # The Phoenix security scanner, failing on any finding at any
      # confidence. Settings, and the types ignored with their reasons, are
      # in .sobelow-conf; a single finding is skipped in the code, with a
      # `# Not a hole:` reason above its `# sobelow_skip`.
      - name: Phoenix security scan (sobelow)
        run: mix sobelow --config

      # Only the issues this change adds, against where it left main: the
      # code that was here before is not rewritten wholesale. Settings, our
      # own checks (credo/checks/) and the reasons for each tuning are in
      # .credo.exs, which judges both sides, so a change to it isn't read
      # as new issues everywhere. On a push to main the merge base with
      # origin/main is the commit itself, which would lint nothing, so
      # there it is the commit main was at before the push.
      - name: Lint what this change adds (credo diff)
        run: mix credo diff --from-git-merge-base "$CREDO_BASE" --config-file "$PWD/.credo.exs"
        env:
          CREDO_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}

  # The CLI (cli/) is its own Mix project with its own suite. The Docker build
  # only compiles it, so without this job nothing checks its formatting,
  # warnings or tests (#798). Only when cli/ changed, on a pull request.
  cli:
    name: cli
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "27"

      # The CLI has no dependencies, so there is no mix.lock to key on: the
      # compiled tree is keyed on mix.exs and the OTP/Elixir pair instead.
      - uses: actions/cache@v4
        with:
          path: cli/_build
          key: ${{ runner.os }}-cli-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('cli/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # The CLI has no dependencies today, so there is nothing for deps.audit
      # to read; hex.audit still fails the day one is added retired or with
      # an advisory.
      - name: Retired or vulnerable packages (hex.audit)
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # The Windows service tests skip themselves without pwsh. ubuntu-latest
      # ships it; fail here if that ever stops being true, rather than letting
      # them quietly skip.
      - name: PowerShell is installed
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Test
        run: mix test

  # The runner daemon (daemon/, a Go module: W-2540). No Elixir or
  # Postgres: its tests fake the server. `mix pre_push` runs the same vet
  # and tests. On a pull request only when daemon/ changed, and on Linux
  # alone (CI_RUNNER's, or GitHub's); on the three OSes it ships for
  # (#2573) only on a v* tag, the nightly schedule and a dispatch (#2832):
  # macOS and Windows are GitHub's runners, paid by the minute on a
  # private repository (10× and 2×). changes.sh gives the list.
  daemon:
    name: daemon (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.daemon_os) }}

    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v4

      # The newest Go, not go.mod's floor (1.24, what a machine needs to
      # build it: the transport's HTTP/2 pings, #2807): macOS's loader
      # refused older test binaries ("missing LC_UUID load command"), and
      # releases build with the newest anyway.
      # No dependencies, so no go.sum for the module cache to key on.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # On Linux and macOS the executors' tests run for real and a missing
      # facility fails them rather than skipping: confined (Landlock,
      # sandbox-exec) on both, and on Linux the user executor, which makes a
      # throwaway account with the runner's passwordless sudo (#2576).
      #
      # With the race detector on every OS (#2664): a test's httptest handler
      # reading state the test owns races even when a child process orders
      # the two, and only -race says so. It costs the most on macOS, where
      # each re-exec of the race-built test binary as a helper takes ~2 s
      # (internal/runner: 20 s without, 2¼ min with).
      - name: Test
        run: go test -race ./...
        env:
          SLIPDOCK_EXECUTOR_TESTS: ${{ matrix.os != 'windows-latest' && '1' || '' }}

  # The one check branch protection needs (#2832): it passes when every job
  # it needs passed or was skipped, so a pull request that skips the suite,
  # the cli or the daemon still reports green, and fails on any failure or
  # cancellation. A skipped job reports by the name it would have had, and
  # a skipped matrix job by its unexpanded one, so naming those as required
  # would leave a pull request waiting forever.
  passed:
    name: all checks
    needs: [changes, test, coverage, repo-checks, static, cli, daemon]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Every job passed or was skipped
        run: |
          echo "$RESULTS"
          if grep -Eq '"(failure|cancelled)"' <<< "$RESULTS"; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
