name: Test

# The commit a pull request run tests is the PR merged into main
# (refs/pull/N/merge), which the API doesn't give: a run's head_sha is the
# PR's head. Its name carries it, so release.yml's suite gate can tell whether
# main's merge commit has the tree this run passed on (#1857). Ignored when
# release.yml calls this workflow.
run-name: "${{ github.event.pull_request.title }} · tested ${{ github.sha }}"

on:
  pull_request:
  workflow_call:

# Everything runs in the test environment, so the warnings check compiles the
# same build `mix test` then reuses instead of a separate dev one.
env:
  MIX_ENV: test

jobs:
  # The suite split four ways, each on its own runner with its own Postgres.
  # The files are split by how long each took (test/support/test_partitions.ex,
  # weights in test/support/partition_weights.tsv), not by `mix test
  # --partitions`, which deals the sorted list out round robin: the slow files
  # land wherever the alphabet puts them, and one new file moves the rest.
  # MIX_TEST_PARTITION also suffixes the database name (config/test.exs). The
  # checks that need doing only once (formatting, the browser scripts) ride
  # along with partition 1.
  test:
    name: test (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    # The test suite needs a real Postgres. config/test.exs defaults to
    # localhost:5434, so that is the port this is published on rather than the
    # usual one — the same address `compose.dev.yaml` gives a developer, which
    # means CI and a laptop run the suite against the same URL and neither
    # needs TEST_DATABASE_URL set.
    #
    # Images come through mirror.gcr.io (Google's cache of Docker Hub), not
    # Docker Hub itself: Hub's anonymous pulls from runners time out or are
    # rate-limited often enough to fail whole runs before any code is checked.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          # Version *ranges*, not exact patches: the Dockerfile pins a specific
          # hexpm image, and pinning the same patch here would break the day
          # setup-beam has no build published for it. The majors are what
          # matter — they are what mix.exs and the release agree on.
          elixir-version: "1.20"
          otp-version: "27"

      # deps and the compiled tree, keyed in layers (#1858): the exact
      # OTP/Elixir pair (a build from another version is no use), the lock
      # file, mix.exs and config, then the code. A run restores the newest
      # build whose key shares the longest prefix with its own, so Mix only
      # recompiles what changed since then, and partition 1 saves the build
      # under this tree's key once it compiles clean.
      - name: Cache keys
        id: keys
        run: |
          deps="${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}"
          config="$deps-${{ hashFiles('mix.exs', 'config/**') }}"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "code=$config-${{ hashFiles('lib/**', 'test/support/**', 'priv/**', 'docs/**') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: mix-cache
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}
          restore-keys: |
            ${{ steps.keys.outputs.config }}-
            ${{ steps.keys.outputs.deps }}-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # The checkout gives every file a fresh mtime. Mix compares sources by
      # digest, but mix.exs and the config files by mtime alone, so a fresh
      # mtime recompiles everything that reads Mix.Project or the config (and
      # what depends on that) though nothing changed. When the restored build
      # was compiled from these same files (its key carries their hash),
      # backdate them; otherwise leave them new so Mix does recompile.
      - name: Backdate mix.exs and config to the cached build
        if: startsWith(steps.mix-cache.outputs.cache-matched-key, format('{0}-', steps.keys.outputs.config))
        run: touch -d 2000-01-01 mix.exs config/*.exs

      - run: mix deps.get

      - name: Check formatting
        if: matrix.partition == 1
        run: mix format --check-formatted

      # An incremental compile still fails on a warning from an earlier one:
      # Mix keeps each file's warnings in its manifest and reports them again.
      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - uses: actions/cache/save@v4
        if: matrix.partition == 1 && steps.mix-cache.outputs.cache-hit != 'true'
        with:
          path: |
            deps
            _build
          key: ${{ steps.keys.outputs.code }}

      # TEST_TIMINGS_FILE has Slipdock.TestTimings record each file's runtime,
      # uploaded below for refreshing the weights (test/support/test_partitions.exs).
      - name: Test
        run: |
          files=$(elixir test/support/test_partitions.exs split 4 "$MIX_TEST_PARTITION")
          mix test $files
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          TEST_TIMINGS_FILE: test-timings/test-timings-${{ matrix.partition }}.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.partition }}
          path: test-timings/
          retention-days: 30

      # The few browser scripts with logic worth testing on their own (the
      # confirm dialog, assets/js/confirm.js), and the Cloudflare Email Worker
      # (cloudflare/inbound-email/) — plain node:test, no packages.
      - uses: actions/setup-node@v4
        if: matrix.partition == 1
        with:
          node-version: "24"

      - name: Test browser scripts and the Email Worker
        if: matrix.partition == 1
        run: node --test 'assets/js/**/*.test.js' 'cloudflare/**/*.test.js'

  # Static checks: the mechanical part of a security review, on every pull
  # request. Each started at zero findings (fixed, or skipped with a reason
  # in its config), so anything new fails the build. None of them needs the
  # database or a compiled app, so they run beside the suite, not in it.
  static:
    name: static checks
    runs-on: ubuntu-latest

    steps:
      # Whole history, so credo can find where the branch left main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "27"

      # A cache of its own: these checks don't compile the app, so a build
      # saved from here under the test job's key would leave the test job
      # compiling the whole app from cold (#1858).
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-static-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-static-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # Retired packages and Hex's own advisories for the locked versions.
      - name: Retired or vulnerable packages (hex.audit)
        run: mix hex.audit

      # The Elixir security advisory database (mix_audit), which also covers
      # git dependencies Hex knows nothing about.
      - name: Dependency advisories (deps.audit)
        run: mix deps.audit

      # The Phoenix security scanner, failing on any finding at any
      # confidence. Settings, and the types ignored with their reasons, are
      # in .sobelow-conf; a single finding is skipped in the code, with a
      # `# Not a hole:` reason above its `# sobelow_skip`.
      - name: Phoenix security scan (sobelow)
        run: mix sobelow --config

      # Only the issues this change adds, against where it left main: the
      # code that was here before is not rewritten wholesale. Settings, our
      # own checks (credo/checks/) and the reasons for each tuning are in
      # .credo.exs, which judges both sides, so a change to it isn't read
      # as new issues everywhere. On a push to main the merge base is the
      # commit itself.
      - name: Lint what this change adds (credo diff)
        run: mix credo diff --from-git-merge-base origin/main --config-file "$PWD/.credo.exs"

  # Secrets in the commits a pull request adds (gitleaks; allowlists in
  # .gitleaks.toml, each with its reason). Values are redacted in the log,
  # since this repository and its logs are public. A real secret found is
  # rotated, not rewritten out of history. The whole history was scanned
  # once by hand when this was added (#1769).
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Secret scan of this pull request's commits (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: /tmp/gitleaks git --redact --no-banner --verbose --log-opts="$BASE..$HEAD" .

  # The CLI (cli/) is its own Mix project with its own suite. The Docker build
  # only compiles it, so without this job nothing checks its formatting,
  # warnings or tests (#798).
  cli:
    name: cli
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "27"

      # The CLI has no dependencies, so there is no mix.lock to key on: the
      # compiled tree is keyed on mix.exs and the OTP/Elixir pair instead.
      - uses: actions/cache@v4
        with:
          path: cli/_build
          key: ${{ runner.os }}-cli-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('cli/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # The CLI has no dependencies today, so there is nothing for deps.audit
      # to read; hex.audit still fails the day one is added retired or with
      # an advisory.
      - name: Retired or vulnerable packages (hex.audit)
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # The Windows service tests skip themselves without pwsh. ubuntu-latest
      # ships it; fail here if that ever stops being true, rather than letting
      # them quietly skip.
      - name: PowerShell is installed
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Test
        run: mix test

  # The runner daemon (daemon/, a Go module: W-2540) on the three OSes it
  # ships for (#2573). No Elixir or Postgres: its tests fake the server.
  # `mix pre_push` runs the same vet and tests.
  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v4

      # The newest Go, not go.mod's floor (1.22, what a machine needs to
      # build it): macOS's loader refuses 1.22's test binaries ("missing
      # LC_UUID load command"), and releases build with the newest anyway.
      # No dependencies, so no go.sum for the module cache to key on.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # On Linux and macOS the executors' tests run for real and a missing
      # facility fails them rather than skipping: confined (Landlock,
      # sandbox-exec) on both, and on Linux the user executor, which makes a
      # throwaway account with the runner's passwordless sudo (#2576).
      - name: Test
        run: go test ./...
        env:
          SLIPDOCK_EXECUTOR_TESTS: ${{ matrix.os != 'windows-latest' && '1' || '' }}
