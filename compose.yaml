# The documented way to run Slipdock:
#
#   cp .env.example .env     # optional; every setting has a default
#   docker compose up -d
#   docker compose logs -f   # the sign-in link is in here when no mail is set up
#
# Then open http://localhost:4000 and sign in with your email address. The first
# address to sign in claims the instance; after that nobody else can sign up
# unless you say so (SLIPDOCK_SIGNUP_ALLOW — see .env.example).

services:
  slipdock:
    build: .
    image: slipdock
    restart: unless-stopped
    ports:
      - "${SLIPDOCK_PUBLISH:-4000}:4000"
    # Everything is optional. `env_file` is where your own settings go; the few
    # below are the ones worth being explicit about in a container.
    env_file:
      - path: .env
        required: false
    environment:
      # The address people will use. Sign-in links are built from it, so
      # localhost only works while you are on this machine.
      PHX_HOST: "${PHX_HOST:-localhost}"
      # ...and how it is reached. The container speaks plain http; if you put a
      # TLS proxy in front, set SLIPDOCK_URL_SCHEME=https and SLIPDOCK_URL_PORT=443
      # so that sign-in links point at the proxy and not at this port.
      SLIPDOCK_URL_SCHEME: "${SLIPDOCK_URL_SCHEME:-http}"
      SLIPDOCK_URL_PORT: "${SLIPDOCK_URL_PORT:-${SLIPDOCK_PUBLISH:-4000}}"
      # SECRET_KEY_BASE is generated into the volume on first run if you do not
      # set one. Set it yourself if you ever run more than one of these.
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-}"
    volumes:
      # The database, uploaded files, each person's OpenRouter key and the
      # generated secret. This is the thing to back up.
      - slipdock-data:/data

volumes:
  slipdock-data:
