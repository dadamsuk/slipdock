# The documented way to run Slipdock:
#
#   cp .env.example .env     # optional; every setting has a default
#   docker compose up -d
#   docker compose logs -f   # the setup token and sign-in codes are in here
#
# Then open http://localhost:4000. A server nobody has set up shows a setup
# wizard, which wants a token printed in the log on first boot — that is what
# stops whoever finds the page first from claiming your server. Setting
# SLIPDOCK_ADMIN_EMAIL skips the wizard entirely.
#
# This pulls a published image, so there is nothing to compile. To build from
# this checkout instead — because you have changed something, or want an
# architecture that is not published:
#
#   SLIPDOCK_GIT_SHA=$(git rev-parse HEAD) docker compose build && docker compose up -d
#
# (the hash is optional: it is what Configuration reports as the running commit,
# and without it that reads "unknown")
#
# which works because the `build` section below is still here; it is simply not
# what `up` reaches for while an image exists.

# Pinned, rather than taken from whatever the directory happens to be called.
# The project name prefixes the volumes (`slipdock_slipdock-data`), so without
# this a clone into a differently named directory gets different volumes — and
# the backup instructions in the README would name ones that do not exist.
name: slipdock

services:
  slipdock:
    image: ghcr.io/dadamsuk/slipdock:${SLIPDOCK_TAG:-latest}
    build:
      context: .
      args:
        SLIPDOCK_GIT_SHA: ${SLIPDOCK_GIT_SHA:-}
    pull_policy: ${SLIPDOCK_PULL_POLICY:-always}
    restart: unless-stopped
    ports:
      - "${SLIPDOCK_PUBLISH:-4000}:4000"
    # Everything is optional. `env_file` is where your own settings go; the few
    # below are the ones worth being explicit about in a container.
    env_file:
      - path: .env
        required: false
    # Names only, with no values. That is the pass-through form: each is taken
    # from the shell if it is set there, and left alone otherwise — so a value
    # in .env is used rather than clobbered.
    #
    # Both ways of configuring this therefore work, which is the point:
    #
    #   export PHX_HOST=slipdock.example.com && docker compose up -d
    #   echo PHX_HOST=slipdock.example.com >> .env && docker compose up -d
    #
    # Giving them values here instead (`PHX_HOST: "${PHX_HOST:-localhost}"`)
    # looks equivalent and is not: `environment:` beats `env_file:`, so the
    # interpolated default would silently overwrite whatever .env said.
    #
    # Publishing on a port other than 4000? Set SLIPDOCK_URL_PORT to match, or
    # the links it emails will name the wrong one.
    environment:
      - PHX_HOST
      - SLIPDOCK_URL_SCHEME
      - SLIPDOCK_URL_PORT
      - SECRET_KEY_BASE
      # The entrypoint builds DATABASE_URL from these, so both ends have to
      # see the same values however they were set — shell or .env.
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - DATABASE_URL
    volumes:
      # Uploaded files, each person's OpenRouter key and the generated secret.
      # The database is in slipdock-db; back up both.
      - slipdock-data:/data
    # Postgres accepts connections a moment after the container starts, and an
    # app that migrates on boot cannot start before it does. `service_healthy`
    # rather than `service_started` is what makes the difference.
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Must match what the app connects with. The app builds its DATABASE_URL
      # from these same three (see deploy/docker-entrypoint.sh), so changing
      # the password in .env changes both ends at once — but only on a *new*
      # volume: Postgres sets the password when it first initialises its data
      # directory and ignores this variable on every boot after that.
      POSTGRES_USER: "${POSTGRES_USER:-slipdock}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-slipdock}"
      POSTGRES_DB: "${POSTGRES_DB:-slipdock}"
    volumes:
      - slipdock-db:/var/lib/postgresql/data
    healthcheck:
      # -U matters: without it pg_isready asks after a role named "root".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slipdock} -d ${POSTGRES_DB:-slipdock}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published. The app reaches it over compose's own network, and a
    # database on a public port is a database somebody else will find. Add
    # `ports: ["127.0.0.1:5432:5432"]` if you want psql on it from the host.
    #
    # Left at Postgres' own defaults, which idle at around 50 MB — a quarter of
    # what the app's BEAM uses, so there is nothing here worth optimising for a
    # board of any ordinary size. On a machine where it genuinely matters (a
    # 512 MB VPS), this trades some performance for about 20 MB:
    #
    #   command: >
    #     postgres -c shared_buffers=32MB -c max_connections=25
    #              -c work_mem=2MB -c maintenance_work_mem=32MB
    #              -c max_wal_size=128MB -c min_wal_size=32MB
    #              -c max_parallel_workers=0 -c max_parallel_workers_per_gather=0
    #
    # Raising POOL_SIZE above 25 means raising max_connections to match.

volumes:
  slipdock-data:
  slipdock-db:
