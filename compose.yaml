# The documented way to run Slipdock:
#
#   cp .env.example .env     # optional; every setting has a default
#   docker compose up -d
#   docker compose logs -f   # the setup token and sign-in codes are in here
#
# Then open http://localhost:4000. A server nobody has set up shows a setup
# wizard, which wants a token printed in the log on first boot — that is what
# stops whoever finds the page first from claiming your server. Setting
# SLIPDOCK_ADMIN_EMAIL skips the wizard entirely.
#
# This pulls a published image, so there is nothing to compile. To build from
# this checkout instead — because you have changed something, or want an
# architecture that is not published:
#
#   docker compose build && docker compose up -d
#
# which works because the `build` section below is still here; it is simply not
# what `up` reaches for while an image exists.

# Pinned, rather than taken from whatever the directory happens to be called.
# The project name prefixes the volume (`slipdock_slipdock-data`), so without
# this a clone into a differently named directory gets a different volume — and
# the backup instructions in the README would name one that does not exist.
name: slipdock

services:
  slipdock:
    image: ghcr.io/dadamsuk/slipdock:${SLIPDOCK_TAG:-latest}
    build: .
    pull_policy: ${SLIPDOCK_PULL_POLICY:-always}
    restart: unless-stopped
    ports:
      - "${SLIPDOCK_PUBLISH:-4000}:4000"
    # Everything is optional. `env_file` is where your own settings go; the few
    # below are the ones worth being explicit about in a container.
    env_file:
      - path: .env
        required: false
    environment:
      # The address people will use. Sign-in links are built from it, so
      # localhost only works while you are on this machine.
      PHX_HOST: "${PHX_HOST:-localhost}"
      # ...and how it is reached. The container speaks plain http; if you put a
      # TLS proxy in front, set SLIPDOCK_URL_SCHEME=https and SLIPDOCK_URL_PORT=443
      # so that sign-in links point at the proxy and not at this port.
      SLIPDOCK_URL_SCHEME: "${SLIPDOCK_URL_SCHEME:-http}"
      SLIPDOCK_URL_PORT: "${SLIPDOCK_URL_PORT:-${SLIPDOCK_PUBLISH:-4000}}"
      # SECRET_KEY_BASE is generated into the volume on first run if you do not
      # set one. Set it yourself if you ever run more than one of these.
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-}"
    volumes:
      # The database, uploaded files, each person's OpenRouter key and the
      # generated secret. This is the thing to back up.
      - slipdock-data:/data

volumes:
  slipdock-data:
